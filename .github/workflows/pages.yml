name: Documentation deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/VOUCHED.td
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build static DocC site
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Swift
        uses: ./.github/actions/setup-swift

      - name: Install mise tools (zig, cmake, ninja)
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Install gnu-tar
        run: brew install gnu-tar

      - name: Restore libghostty-vt cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Key/path shape must match CI so both share entries.
          path: |
            ~/.cache/tessera/libghostty-vt
            !~/.cache/tessera/libghostty-vt/source
            !~/.cache/tessera/libghostty-vt/cmake
          # Exact-only to prevent a stale native install from being relabeled.
          # prettier-ignore
          key: libghostty-vt-v4-${{ runner.os }}-${{ runner.arch }}-zig-0.17.0-${{ hashFiles('scripts/ghostty-vt-version.txt', 'scripts/build-libghostty-vt.sh', 'scripts/build-libghostty-vt.ps1') }}

      - name: Build static docs
        run: mise run docs:build

      - name: Archive Pages artifact
        run: |
          gtar \
            --dereference --hard-dereference \
            --directory .build/docs \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy static DocC site
    needs: build
    if: >
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name
      == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
