name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      vouch-only: ${{ steps.changes.outputs.vouch-only }}
    steps:
      - name: Block CI while skip-ci label is applied
        if: >
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'skip-ci')
        run: |
          echo "The skip-ci label is applied. Remove it to run CI checks."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect trust-only change
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          vouch_only=false
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] &&
            [[ "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" == ".github/VOUCHED.td" ]]; then
            vouch_only=true
          fi
          echo "vouch-only=$vouch_only" >> "$GITHUB_OUTPUT"

  conventional-commits:
    name: conventional commits
    needs: ci-gate
    if: >
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commit subjects
        if: github.event_name == 'push'
        run:
          python3 scripts/conventional_commits.py --range "${{ github.event.before }}..${{
          github.event.after }}"

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/conventional_commits.py "$PR_TITLE"

  lint:
    name: lint
    needs: ci-gate
    if: >
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate trust-only change
        if: needs.ci-gate.outputs.vouch-only == 'true'
        run: node --test .github/scripts/vouch-gate.test.cjs

      - name: Set up Swift
        if: needs.ci-gate.outputs.vouch-only != 'true'
        uses: ./.github/actions/setup-swift

      - name: Install mise tools
        if: needs.ci-gate.outputs.vouch-only != 'true'
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Install markup tools
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run: npm ci

      - name: Run portable quality gate
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run: mise run quality:lint

  test:
    name: test (${{ matrix.name }})
    needs: ci-gate
    if: >
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ matrix.os }}
    # The xcode-27 label is a public preview image (actions/runner-images#14404); its leg
    # reports but cannot fail the run until the image is generally available.
    continue-on-error: ${{ matrix.required == false }}
    # Windows builds from scratch: it keeps no SwiftPM cache (see the step that removes it).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    strategy:
      # Cancel sibling OS jobs on first failure to save hosted minutes.
      fail-fast: true
      matrix:
        include:
          # Baseline lane: Xcode 26.6 on macOS, the swift.org release named by
          # .swift-version on Linux and Windows. These three names are the required
          # status checks in the main branch ruleset; keep them stable.
          - name: macos-26
            os: macos-26
            xcode: "26.6"
            required: true
          - name: ubuntu-latest
            os: ubuntu-latest
            required: true
          - name: windows-latest
            os: windows-latest
            required: true
          # Swift 6.4 lane: swift.org 6.4.1 on Linux, Xcode 27.1 on the xcode-27 preview
          # image. No Windows 6.4 leg yet (owner decision pending).
          - name: ubuntu-latest / swift-6.4.1
            os: ubuntu-latest
            swift-version: "6.4.1"
            required: true
          - name: xcode-27
            os: xcode-27
            xcode: "27.1"
            required: false
    steps:
      - name: Skip full platform tests for trust-only change
        if: needs.ci-gate.outputs.vouch-only == 'true'
        run: echo "Trust-only change; full platform tests are not required."

      - name: Checkout
        if: needs.ci-gate.outputs.vouch-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Swift
        id: swift
        if: needs.ci-gate.outputs.vouch-only != 'true'
        uses: ./.github/actions/setup-swift
        with:
          xcode: ${{ matrix.xcode || '26.6' }}
          swift-version: ${{ matrix.swift-version || '' }}

      - name: Restore SwiftPM cache
        id: swiftpm-cache
        if: needs.ci-gate.outputs.vouch-only != 'true' && runner.os != 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # prettier-ignore
          key: swiftpm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.toolchain }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.toolchain }}-

      - name: Remove restored Windows build tree
        if: needs.ci-gate.outputs.vouch-only != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .build) {
            Remove-Item -LiteralPath .build -Recurse -Force
          }

      # Package.resolved is owned by the Swift 6.4 lane, whose graph is larger
      # (xctest-dynamic-overlay's 6.4 manifest adds swift-issue-reporting). Swift 6.3 drops
      # that pin on any plain resolve or build, so every SwiftPM command here, as in the
      # mise tasks, passes --only-use-versions-from-resolved-file, which also fails a lane
      # whose resolved file is out of date (docs/architecture/toolchain-lanes.md).
      - name: Check the resolved files are current
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run: |
          swift package resolve --only-use-versions-from-resolved-file
          swift package resolve --only-use-versions-from-resolved-file --package-path Examples

      - name: Build
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run: swift build --only-use-versions-from-resolved-file

      - name: Build Examples
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run: swift build --only-use-versions-from-resolved-file --package-path Examples

      - name: Save SwiftPM cache after build
        if: >
          needs.ci-gate.outputs.vouch-only != 'true' && runner.os != 'Windows' &&
          steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # prettier-ignore
          key: swiftpm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.toolchain }}-${{ hashFiles('Package.resolved') }}

      - name: Test
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run: swift test --only-use-versions-from-resolved-file --no-parallel

      - name: Test Examples
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run:
          swift test --only-use-versions-from-resolved-file --no-parallel --package-path
          Examples

      # The behaviour corpus (docs/architecture/developer-tooling.md): every leg, Windows
      # included, runs the scenarios in Examples/Scenarios against their committed goldens,
      # which are checked out with LF (.gitattributes). A drifted golden or a failed
      # expectation fails the leg.
      - name: Run the scenario corpus
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run:
          swift run --only-use-versions-from-resolved-file --package-path Examples tessera
          run --pretty Examples/Scenarios

      - name: Check the resolved files are unchanged
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run: git diff --exit-code -- Package.resolved Examples/Package.resolved

  test-parallel:
    name: test (parallel, ubuntu-latest)
    needs: ci-gate
    if: >
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ubuntu-latest
    # Non-required: it guards the parallel-safety rule in CONTRIBUTING.md (plan 034 Step
    # 9.8) and reports without blocking a merge.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Skip for trust-only change
        if: needs.ci-gate.outputs.vouch-only == 'true'
        run: echo "Trust-only change; the parallel suite is not required."

      - name: Checkout
        if: needs.ci-gate.outputs.vouch-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Swift
        id: swift
        if: needs.ci-gate.outputs.vouch-only != 'true'
        uses: ./.github/actions/setup-swift

      - name: Restore SwiftPM cache
        if: needs.ci-gate.outputs.vouch-only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # prettier-ignore
          key: swiftpm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.toolchain }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.toolchain }}-

      - name: Test in parallel
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run: swift test --only-use-versions-from-resolved-file --parallel

  version-consumer:
    name: version consumer (${{ matrix.os }})
    needs: ci-gate
    if: >
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-26-intel runs the bundle's x86_64 macOS slice, which an Apple silicon Mac
        # without Rosetta can link but not run.
        os: [macos-26, macos-26-intel, ubuntu-latest, windows-latest]
    steps:
      - name: Skip for trust-only change
        if: needs.ci-gate.outputs.vouch-only == 'true'
        run: echo "Trust-only change; the version consumer is not required."

      - name: Checkout
        if: needs.ci-gate.outputs.vouch-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A full clone, so the temporary clone below is not shallow.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Swift
        if: needs.ci-gate.outputs.vouch-only != 'true'
        uses: ./.github/actions/setup-swift

      # Tests/Fixtures/VersionConsumer depends on Tessera by version, as an app would:
      # through a file:// clone of this checkout tagged 0.0.0-ci. It must link
      # libghostty-vt from the published bundle, with no Zig on the machine.
      - name: Build, run, and test the version consumer
        if: needs.ci-gate.outputs.vouch-only != 'true'
        shell: bash
        run: |
          if command -v zig; then
            echo "::error::zig is on PATH; a version consumer must not need it"
            exit 1
          fi
          clone="$RUNNER_TEMP/version-consumer/tessera"
          git clone --quiet "$GITHUB_WORKSPACE" "$clone"
          git -C "$clone" tag 0.0.0-ci
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export TESSERA_VERSION_CONSUMER_URL="file:///$(cygpath -m "$clone")"
          else
            export TESSERA_VERSION_CONSUMER_URL="file://$clone"
          fi
          cd Tests/Fixtures/VersionConsumer
          swift build
          swift run VersionConsumer
          swift test

  static-linux:
    name: static Linux SDK
    needs: ci-gate
    if: >
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip for trust-only change
        if: needs.ci-gate.outputs.vouch-only == 'true'
        run: echo "Trust-only change; the static Linux SDK build is not required."

      - name: Checkout
        if: needs.ci-gate.outputs.vouch-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Swift
        if: needs.ci-gate.outputs.vouch-only != 'true'
        uses: ./.github/actions/setup-swift

      # The Static Linux SDK needs a swift.org toolchain, so this runs here rather than
      # from Xcode on a Mac (`mise run linux:build` locally needs swiftly's toolchain).
      - name: Build the library targets for x86_64 and aarch64 musl
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run: scripts/build-static-linux.sh

      # The bundle's musl variants: link the version consumer statically and run it.
      - name: Build and run the version consumer statically
        if: needs.ci-gate.outputs.vouch-only != 'true'
        run: |
          clone="$RUNNER_TEMP/version-consumer/tessera"
          git clone --quiet "$GITHUB_WORKSPACE" "$clone"
          git -C "$clone" tag 0.0.0-ci
          export TESSERA_VERSION_CONSUMER_URL="file://$clone"
          cd Tests/Fixtures/VersionConsumer
          swift build --swift-sdk aarch64-swift-linux-musl --product VersionConsumer
          swift build --swift-sdk x86_64-swift-linux-musl --product VersionConsumer
          binary=.build/x86_64-swift-linux-musl/debug/VersionConsumer
          file "$binary"
          "$binary"
